; PlatformIO Project Configuration File
;
; FST-150 Tyre Temperature and Steering Angle Data System
; https://github.com/MegaLoMonkey/ESP32-EBD-FST150-tyre-temp
;
; Two build environments:
;   tyre_node    - MLX90640 thermal camera plus CAN bus output
;   steering_node - AS5600 magnetic encoder plus CAN bus output
;
; Tyre corner is set via build flag at compile time:
;   pio run -e tyre_node_FL
;   pio run -e tyre_node_FR
;   pio run -e tyre_node_RL
;   pio run -e tyre_node_RR

[platformio]
default_envs = tyre_node_FL

; ============================================================================
; Common settings inherited by all environments
; ============================================================================
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Common libraries used across node types
lib_deps =
    handmade0octopus/ESP32-TWAI-CAN@^1.0.1

; Common build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3

; ============================================================================
; Tyre node environments (one per corner)
; ============================================================================
[tyre_base]
board = lolin32_lite
lib_deps =
    ${env.lib_deps}
    sparkfun/SparkFun_MLX90640_Arduino_Example
build_flags =
    ${env.build_flags}
    -DNODE_TYPE_TYRE

[env:tyre_node_FL]
extends = tyre_base
build_flags =
    ${tyre_base.build_flags}
    -DTYRE_CORNER=0
    -DCAN_TX_ID=0x320

[env:tyre_node_FR]
extends = tyre_base
build_flags =
    ${tyre_base.build_flags}
    -DTYRE_CORNER=1
    -DCAN_TX_ID=0x321

[env:tyre_node_RL]
extends = tyre_base
build_flags =
    ${tyre_base.build_flags}
    -DTYRE_CORNER=2
    -DCAN_TX_ID=0x322

[env:tyre_node_RR]
extends = tyre_base
build_flags =
    ${tyre_base.build_flags}
    -DTYRE_CORNER=3
    -DCAN_TX_ID=0x323

; ============================================================================
; Steering angle node
; ============================================================================
[env:steering_node]
board = lolin32_lite
lib_deps =
    ${env.lib_deps}
    ; AS5600 library added when steering node development starts
build_flags =
    ${env.build_flags}
    -DNODE_TYPE_STEERING
    -DCAN_TX_ID=0x310
